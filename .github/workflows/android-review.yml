name: Android Review

on:
  pull_request:
    paths:
      - "apps/field-android/**"
      - ".github/workflows/android-review.yml"
  push:
    paths:
      - "apps/field-android/**"
      - ".github/workflows/android-review.yml"
  workflow_dispatch:

concurrency:
  group: android-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-review:
    name: JVM Review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/field-android
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/field-android/**/*.gradle*
            apps/field-android/**/gradle-wrapper.properties

      - name: Ensure Gradle scripts are executable
        run: chmod +x gradlew scripts/review-app.sh

      - name: Compile and run unit tests
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon

      - name: Upload JVM reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-jvm-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/field-android/app/build/reports
            apps/field-android/app/build/test-results
            apps/field-android/build/reports

  ui-review:
    name: UI Smoke Review
    runs-on: ubuntu-latest
    needs: jvm-review
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/field-android/**/*.gradle*
            apps/field-android/**/gradle-wrapper.properties

      - name: Ensure Gradle scripts are executable
        working-directory: apps/field-android
        run: chmod +x gradlew scripts/review-app.sh

      - name: Run Android reviewer on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: cd apps/field-android && SKIP_JVM_REVIEW=1 ./scripts/review-app.sh

      - name: Upload UI review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-review-artifacts
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/field-android/build/reviewer
            apps/field-android/app/build/reports
            apps/field-android/app/build/outputs/androidTest-results
