name: FieldIOSDemo

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  FieldIOSDemoCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/FieldIOSDemoCore
    resources:
      - path: Sources/FieldIOSDemoCore/Resources/demo_scenarios.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.laiq.fieldiosdemo.core
        PRODUCT_NAME: FieldIOSDemoCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FieldIOSDemoCore

  FieldIOSDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Scaffold
    dependencies:
      - target: FieldIOSDemoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.laiq.fieldiosdemo
        PRODUCT_NAME: FieldIOSDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LAIQ Field iOS Demo
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  FieldIOSDemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/FieldIOSDemoCoreTests
    dependencies:
      - target: FieldIOSDemoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.laiq.fieldiosdemo.tests
        PRODUCT_NAME: FieldIOSDemoTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FieldIOSDemo:
    build:
      targets:
        FieldIOSDemo: all
        FieldIOSDemoCore: [build]
        FieldIOSDemoTests: [test]
    test:
      targets:
        - name: FieldIOSDemoTests
