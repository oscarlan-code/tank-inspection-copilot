[project]
name = "laiq-kb-ingestion"
version = "0.1.0"
description = "Governed historical-report ingestion worker for the LAIQ Report Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "docling>=2.70,<3",
  "llama-index-core>=0.14,<0.15",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
]

[project.scripts]
kb-ingest = "laiq_kb_ingestion.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laiq_kb_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
